<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>JobBolt Sarreguemines</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap">
<style>
/* Layout: one phone-width column (max 480px). Sticky top bar with mode switch, scrolling view, fixed bottom tabs, sheets slide up from the bottom.
   Identity: faïence cobalt (Sarreguemines ceramics) + signal yellow for the "bolt" (anything immediate). Map is a schematic SVG. */
:root{
  --bg:#EEF2F7; --outer:#DDE5F0; --surface:#FFFFFF; --ink:#0F1E36; --muted:#5B6B84; --line:#D9E1EC;
  --brand:#1F4FD8; --brand-ink:#FFFFFF; --brand-soft:#E3EBFD;
  --bolt:#FFC21A; --bolt-ink:#1A1400;
  --ok:#138A5B; --ok-soft:#DDF3EA; --warn:#A85A08; --warn-soft:#FBEBD6; --danger:#B93226; --danger-soft:#FBE3DF;
  --map-land:#E6ECF4; --map-water:#BCD3F3; --map-road:#FFFFFF; --map-park:#D2EBDB;
  --shadow:0 1px 2px rgba(15,30,54,.06),0 8px 24px rgba(15,30,54,.08);
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1322; --outer:#060B15; --surface:#131E33; --ink:#EAF0FA; --muted:#9AA9C2; --line:#243350;
    --brand:#7C9EFF; --brand-ink:#0B1322; --brand-soft:#1B2A4A;
    --ok:#4AD39B; --ok-soft:#12332A; --warn:#F0A64B; --warn-soft:#3A2A12; --danger:#FF8577; --danger-soft:#3D1A17;
    --map-land:#18253D; --map-water:#27456F; --map-road:#2B3A57; --map-park:#17332B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1322; --outer:#060B15; --surface:#131E33; --ink:#EAF0FA; --muted:#9AA9C2; --line:#243350;
  --brand:#7C9EFF; --brand-ink:#0B1322; --brand-soft:#1B2A4A;
  --ok:#4AD39B; --ok-soft:#12332A; --warn:#F0A64B; --warn-soft:#3A2A12; --danger:#FF8577; --danger-soft:#3D1A17;
  --map-land:#18253D; --map-water:#27456F; --map-road:#2B3A57; --map-park:#17332B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
@media (min-width:720px){
  body{background:var(--outer)}
  .app{background:var(--bg);box-shadow:var(--shadow);padding-inline:16px;border-radius:0 0 22px 22px}
  body::before{background:var(--outer)}
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
h2,h3,.disp{font-family:var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:13px}
.ic{display:block;flex:none}
.app{max-width:480px;margin:0 auto;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}

/* top */
.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 8px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:11px;background:var(--bolt);color:var(--bolt-ink);display:grid;place-items:center;flex:none}
.bt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.bt b{font:800 21px var(--f-display);letter-spacing:-.02em}
.bt span{font-size:12px;color:var(--muted);font-weight:600}
.acts{display:flex;gap:6px}
.icb{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.dotb{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font:700 11px/18px var(--f-body);text-align:center;padding:0 4px;font-style:normal}
.modebar{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.modebar button{min-height:42px;border:0;border-radius:10px;background:transparent;font-weight:700;color:var(--muted)}
.modebar button.on{background:var(--bolt);color:var(--bolt-ink)}
.proto{font-size:12px;color:var(--muted);text-align:center;padding:4px 0 10px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
.nav-in{width:100%;max-width:480px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.nav button{position:relative;border:0;background:transparent;min-height:58px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.nav button.on{color:var(--brand)}
.nav button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:2px;background:var(--brand)}
.nav .bdg{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--bolt);color:var(--bolt-ink);font:800 11px/18px var(--f-body);padding:0 4px;text-align:center}

/* generic */
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:6px 2px 0}
.sec h3{font-size:17px}
.btn{min-height:48px;border:0;border-radius:12px;padding:0 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-bolt{background:var(--bolt);color:var(--bolt-ink)}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn.full{width:100%}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.link{border:0;background:none;color:var(--brand);font-weight:700;padding:0;text-decoration:underline}
.note{padding:10px 12px;border-radius:12px;background:var(--brand-soft);font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.now{background:var(--bolt);color:var(--bolt-ink)}
.pill.you{background:var(--brand-soft);color:var(--brand)}
.pill.de{background:var(--warn-soft);color:var(--warn)}
.pill.wait{background:var(--brand-soft);color:var(--brand)}
.pill.act{background:var(--bolt);color:var(--bolt-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.seg button{min-height:36px;padding:0 12px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.seg.full{display:grid;width:100%}
.in{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0 12px;font-size:16px}
textarea.in{padding:10px 12px;min-height:84px;resize:vertical;line-height:1.4}
.lbl-f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.sw{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;cursor:pointer}
.sw input{appearance:none;-webkit-appearance:none;width:42px;height:26px;border-radius:13px;background:var(--line);position:relative;margin:0;flex:none;cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked{background:var(--brand)}
.sw input:checked::after{transform:translateX(16px)}
input[type=range]{width:100%;accent-color:var(--brand)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.stepper b{min-width:64px;text-align:center;font:700 20px var(--f-display)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 18px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px}
.empty .ic{color:var(--brand)}

/* mission cards */
.ctrl{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.search{position:relative;display:block}
.search .ic{position:absolute;left:13px;top:15px;color:var(--muted)}
.search input{padding-left:40px}
.row2{display:flex;gap:10px;align-items:center;justify-content:space-between}
.row2 select{flex:1;min-width:0}
.switches{display:flex;gap:18px;flex-wrap:wrap}
.live{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600;margin:2px 2px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(19,138,91,.5)}70%{box-shadow:0 0 0 8px rgba(19,138,91,0)}100%{box-shadow:0 0 0 0 rgba(19,138,91,0)}}
.mission,.need{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:start;cursor:pointer;margin-bottom:10px}
.mission.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.mi{width:46px;height:46px;border-radius:13px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.mi.big{width:52px;height:52px}
.mt{font:700 16px/1.25 var(--f-display);margin-bottom:2px;overflow-wrap:anywhere}
.ms{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.ms .ic{color:var(--bolt);filter:drop-shadow(0 0 0 var(--bolt-ink))}
.mm{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mp{text-align:right}
.mp b{display:block;font:800 21px var(--f-display);letter-spacing:-.02em}
.mp small{font-size:12px;color:var(--muted);white-space:nowrap}

/* map */
.map{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--map-land);margin-bottom:10px}
.map svg{display:block;width:100%;height:auto}
.m-land{fill:var(--map-land)}
.m-park{fill:var(--map-park)}
.m-river{fill:none;stroke:var(--map-water);stroke-width:3.4;stroke-linecap:round}
.m-road{fill:none;stroke:var(--map-road);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.m-road.big{stroke-width:1.8}
.lbl{font:600 2.5px var(--f-body);fill:var(--muted);text-anchor:middle}
.lbl.river{font-style:italic;fill:var(--brand)}
.pin{cursor:pointer}
.pin rect{fill:var(--surface);stroke:var(--brand);stroke-width:.45}
.pin text{font:800 3.1px var(--f-display);fill:var(--ink);text-anchor:middle}
.pin .pdot{fill:var(--brand)}
.pin.now rect{fill:var(--bolt);stroke:var(--bolt-ink)}
.pin.now text{fill:var(--bolt-ink)}
.pin.sel rect{fill:var(--brand)}
.pin.sel text{fill:var(--brand-ink)}
.me-halo{fill:var(--brand);opacity:.22;transform-box:fill-box;transform-origin:center;animation:halo 2.4s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.4}100%{transform:scale(1.8);opacity:0}}
.me-dot{fill:var(--brand);stroke:var(--surface);stroke-width:.8}

/* active mission */
.steps{list-style:none;margin:14px 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps li{font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.steps li::before{content:"";height:5px;border-radius:3px;background:var(--line)}
.steps li.done::before{background:var(--brand)}
.steps li.cur{color:var(--ink)}
.steps li.cur::before{background:var(--bolt)}
.bigtime{font:800 36px var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chat{display:flex;flex-direction:column;gap:8px;max-height:230px;overflow-y:auto;padding:2px}
.bub{max-width:82%;padding:8px 12px;border-radius:14px;font-size:14px}
.bub.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}
.bub.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;text-align:center;max-width:100%}
.msgrow{display:flex;gap:8px;margin-top:10px}
.msgrow .in{min-height:44px}
.msgrow button{width:44px;height:44px;border-radius:12px;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}

/* wallet */
.bal{background:var(--brand);color:var(--brand-ink);border:0;display:flex;flex-direction:column;gap:6px}
.bal .amt{font:800 44px var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bal .tag{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.18)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:130px;margin-top:12px}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%;font-size:12px;color:var(--muted);font-weight:600}
.col i{display:block;width:100%;border-radius:7px 7px 3px 3px;background:var(--brand-soft)}
.col.today i{background:var(--bolt)}
.col span{font-variant-numeric:tabular-nums}
.hrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--ok-soft);color:var(--ok)}
.hico.out{background:var(--brand-soft);color:var(--brand)}
.hmid{flex:1;min-width:0}
.hmid b{display:block;font-weight:600;overflow-wrap:anywhere}
.hmid small{color:var(--muted)}
.hamt{font:700 16px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.hamt.pos{color:var(--ok)}

/* profile */
.me{display:flex;align-items:center;gap:14px}
.avatar{width:62px;height:62px;border-radius:50%;background:var(--bolt);color:var(--bolt-ink);display:grid;place-items:center;font:800 26px var(--f-display);flex:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.tile b{display:block;font:800 22px var(--f-display);font-variant-numeric:tabular-nums}
.tile small{font-size:12px;color:var(--muted)}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:4px}
.vrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.vrow:first-of-type{border-top:0}
.vic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--line);color:var(--muted)}
.vrow.ok .vic{background:var(--ok);color:#fff}
.vrow b{display:block}
.vrow small{color:var(--muted)}

/* employer */
.hero{background:var(--ink);color:var(--bg);border:0}
.hero h2{font-size:26px;line-height:1.1}
.hero p{margin-top:8px;opacity:.85}
.er{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.er b{font-variant-numeric:tabular-nums}
.er.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:16px}
.er.tot b{font:800 22px var(--f-display)}
.app-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.app-row:first-of-type{border-top:0}
.app-av{width:42px;height:42px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font:800 16px var(--f-display);flex:none}

/* sheets / toasts */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,14,26,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92%;overflow-y:auto;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:var(--shadow);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 14px}
.sh-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.sh-head h3{font-size:20px;line-height:1.15}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.fact{background:var(--bg);border-radius:12px;padding:10px 12px}
.fact small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.fact b{font:700 17px var(--f-display)}
.fact.pay{background:var(--bolt);color:var(--bolt-ink)}
.fact.pay small{color:var(--bolt-ink);opacity:.75}
.reqs{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.reqs li{display:flex;gap:8px;align-items:center}
.reqs .ic{color:var(--ok)}
.trust{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:14px}
.trust .ic{color:var(--ok);margin-top:2px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.paid{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.bolt-big{width:84px;height:84px;border-radius:50%;background:var(--bolt);color:var(--bolt-ink);display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.paid .amt{font:800 44px var(--f-display);color:var(--ok);letter-spacing:-.03em}
.stars{display:flex;gap:4px;justify-content:center}
.stars button{border:0;background:none;padding:4px;color:var(--line)}
.stars button.on{color:var(--bolt)}
.about h4{font:700 16px var(--f-display);margin:18px 0 6px}
.about p,.about li{font-size:14px;color:var(--muted)}
.about ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.about b{color:var(--ink)}
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;

function statusInfo(n){

  n.apps.forEach(function(a){

   +(a.ok?'<span class="pill ok">Confirmé</span>':'<button class="btn btn-primary sm" data-action="acceptApp" data-n="'+n.id+'" data-a="'+a.id+'">Accepter</button>')+'</div>';
  });
  html+='<div class="btns"><button class="btn btn-danger" data-action="cancelNeed" data-id="'+n.id+'">Annuler ce besoin</button></div>';
 }else{
  html+='<div class="sec"><h3>'+(n.people>1?"Équipe":"Personne confirmée")+'</h3></div>';
  n.apps.filter(function(a){return a.ok}).forEach(function(a){
   var sub=n.status==="accepted"?"En route, arrive en "+a.eta+" min":n.status==="working"?"Sur place, mission en cours":n.status==="review"?"A terminé la mission":"Mission payée";
   html+='<div class="app-row"><div class="app-av">'+esc(initials(a.name))+'</div><div style="flex:1;min-width:0"><b>'+esc(a.name)+'</b><div class="small muted">★ '+a.rate.toFixed(1).replace(".",",")+' · '+sub+'</div></div></div>';
  });
  if(n.status==="review")html+='<div class="trust" style="margin-top:14px">'+ico("lock",20)+'<span><b>'+fmtE(n.total)+'</b> sont bloqués. Valide la mission pour les verser tout de suite.</span></div><div class="btns"><button class="btn btn-bolt full" data-action="payNeed" data-id="'+n.id+'">'+ico("bolt",18,true)+'Valider et payer '+fmtE(n.total)+'</button></div>';
  if(n.status==="accepted"||n.status==="working")html+='<div class="note" style="margin-top:14px">Le paiement reste bloqué jusqu\'à ta validation.</div>';
  if(n.status==="paid")html+=receiptBlock(n);
 }
 html+='<div class="btns"><button class="btn btn-ghost full" data-action="close">Fermer</button></div>';
 openSheet(html,{t:"need",id:id});
}
function receiptBlock(n){
 return '<div class="card" style="margin-top:14px;background:var(--bg)"><div class="er"><span>Rémunération'+(n.people>1?" ("+n.people+" pers.)":"")+'</span><b>'+fmtE(r2(n.total-n.fee))+'</b></div><div class="er"><span>Frais de service (8 %)</span><b>'+fmtE(n.fee)+'</b></div><div class="er tot"><span>Total payé</span><b>'+fmtE(n.total)+'</b></div></div>'
 +'<p class="small muted" style="margin:14px 0 6px;text-align:center">Note la mission</p><div class="stars" id="stars">'+starsHtml(n.rated||0)+'</div>';
}
function refreshNeed(id){
 renderNav();
 if(S.mode==="employer"&&S.tab==="needs")render();
 if(S.sheet&&S.sheet.t==="need"&&S.sheet.id===id&&!$("#ov").hidden)sheetNeed(id);
}
function addApplicant(id){
 var n=findN(id);if(!n||n.status!=="search"||n.apps.length>=n.people+2)return;
 var used=n.apps.map(function(a){return a.name}),pool=NAMES.filter(function(x){return used.indexOf(x[0])<0});if(!pool.length)return;
 var p=pick(pool),k=r2(0.4+Math.random()*3.2);
 n.apps.push({id:"a"+(++uid),name:p[0],rate:p[1],done:p[2],km:k,eta:Math.max(2,Math.round(k*3+2)),ok:false});
 notify("Nouveau candidat : "+p[0]+" pour « "+n.title+" »");
 refreshNeed(id);
}
function progressNeed(n){
 later(function(){
  if(n.status!=="accepted")return;
  n.status="working";
  notify(n.apps.filter(function(a){return a.ok}).map(function(a){return a.name}).join(" et ")+" "+(n.people>1?"sont arrivés":"est arrivé(e)")+" pour « "+n.title+" »");
  refreshNeed(n.id);
 },7000);
 later(function(){
  if(n.status!=="working")return;
  n.status="review";
  notify("Mission terminée : « "+n.title+" » attend ta validation");
  refreshNeed(n.id);
 },17000);
}

/* ---------- render ---------- */
function render(){
 renderTop();renderNav();
 var h="";
 if(S.mode==="worker")h=S.tab==="missions"?vMissions():S.tab==="active"?vActive():S.tab==="wallet"?vWallet():vProfile();
 else h=S.tab==="publish"?vPublish():S.tab==="needs"?vNeeds():vHistory();
 $("#view").innerHTML=h;
 if(S.mode==="worker"&&S.tab==="missions")renderList();
 if(S.mode==="worker"&&S.tab==="active")renderChat();
 if(S.mode==="employer"&&S.tab==="publish")syncDraft();
}
function go(tab){S.tab=tab;render();window.scrollTo(0,0)}

/* ---------- actions ---------- */
var A={
 tab:function(el){closeSheet();go(el.getAttribute("data-t"))},
 mode:function(el){var m=el.getAttribute("data-m");if(m===S.mode)return;S.mode=m;S.tab=m==="worker"?"missions":"publish";closeSheet();save();render();window.scrollTo(0,0)},
 theme:function(){var n=effDark()?"light":"dark";document.documentElement.setAttribute("data-theme",n);S.theme=n;save();renderTop()},
 cat:function(el){S.cat=el.getAttribute("data-c");S.sel=null;render()},
 view:function(el){S.view=el.getAttribute("data-v");render()},
 resetFilters:function(){S.cat="all";S.q="";S.nowOnly=false;S.p.radius=Math.max(S.p.radius,10);save();render()},
 goAvail:function(){S.p.avail=true;save();render();toast("Tu es disponible")},
 open:function(el){sheetMission(el.getAttribute("data-id"))},
 pin:function(el){S.sel=el.getAttribute("data-id");renderList()},
 close:function(){closeSheet()},
 toProfile:function(){closeSheet();S.tab="profile";render();window.scrollTo(0,0)},
 goWallet:function(){closeSheet();go("wallet")},
 accept:function(el){
  var m=findM(el.getAttribute("data-id"));if(!m)return;
  if(S.active){toast("Termine d'abord ta mission en cours");return}
  if(!S.p.v.id){toast("Vérifie ton identité d'abord");return}
  S.missions=S.missions.filter(function(x){return x.id!==m.id});
  S.active={m:m,step:0,acceptedAt:Date.now(),workStart:null,arriveAt:0,chat:[]};
  sys(S.active,"Mission acceptée. "+fmtE(m.pay)+" sont bloqués et t'attendent.");
  closeSheet();S.tab="active";S.sel=null;render();window.scrollTo(0,0);
  toast("Mission acceptée : "+m.title);
  var id=m.id;
  later(function(){if(S.active&&S.active.m.id===id){S.active.chat.push({f:"them",x:"Merci d'avoir accepté ! Sonne à ton arrivée, je t'attends.",t:Date.now()});if(S.mode==="worker"&&S.tab==="active")renderChat()}},1500);
 },
 go:function(){
  var a=S.active;if(!a)return;
  if(a.step===0){a.step=1;var eta=Math.max(2,Math.round(dist(a.m)*3+2));a.arriveAt=Date.now()+eta*60000;sys(a,"Tu es en route. Arrivée prévue vers "+hhmm(a.arriveAt)+".")}
  else if(a.step===1){a.step=2;a.workStart=Date.now();sys(a,"Arrivée confirmée. Bon travail !")}
  else{finishMission();return}
  render();
 },
 say:function(el){say(el.getAttribute("data-x"))},
 send:function(){var i=$("#msg");if(!i)return;var v=i.value;i.value="";say(v)},
 cancelAsk:function(){sheetCancel()},
 cancel:function(){
  var a=S.active;if(!a)return;
  a.m.startAt=Math.max(a.m.startAt,Date.now()+5*60000);S.missions.push(a.m);S.active=null;
  S.p.onTime=Math.max(60,S.p.onTime-2);save();closeSheet();render();toast("Mission annulée, elle redevient disponible");
 },
 rate:function(el){
  var v=+el.getAttribute("data-v"),box=$("#stars");if(box)box.innerHTML=starsHtml(v);
  if(S.sheet&&S.sheet.t==="need"){var n=findN(S.sheet.id);if(n)n.rated=v}
 },
 withdrawAsk:function(){if(S.balance<1){toast("Solde insuffisant");return}sheetWithdraw()},
 withdraw:function(){
  var amt=S.balance;if(amt<1)return;
  S.hist.unshift({t:Date.now(),label:"Virement instantané",amt:-amt,kind:"out"});S.balance=0;save();closeSheet();render();toast(fmtE(amt)+" envoyés sur ton compte");
 },
 skill:function(el){var c=el.getAttribute("data-c"),i=S.p.skills.indexOf(c);if(i>=0)S.p.skills.splice(i,1);else S.p.skills.push(c);save();render()},
 ver:function(el){var k=el.getAttribute("data-k");S.p.v[k]=!S.p.v[k];save();render();toast(S.p.v[k]?"Vérifié (simulation)":"Vérification retirée")},
 about:function(){sheetAbout()},
 bell:function(){sheetBell()},
 welcomeOk:function(){S.onboarded=true;save();closeSheet()},
 resetAsk:function(){sheetReset()},
 reset:function(){try{localStorage.removeItem(KEY)}catch(e){}location.reload()},
 /* employer */
 dcat:function(el){S.draft.cat=el.getAttribute("data-c");render()},
 tpl:function(el){var t=TPL[+el.getAttribute("data-i")];S.draft=Object.assign(S.draft,t);render()},
 dstart:function(el){S.draft.start=el.getAttribute("data-s");render()},
 dpay:function(el){var p=el.getAttribute("data-p");if(p===S.draft.payType)return;S.draft.payType=p;S.draft.amount=p==="hour"?13:Math.round(S.draft.hours*13);render()},
 dh:function(el){S.draft.hours=Math.min(10,Math.max(0.5,S.draft.hours+(+el.getAttribute("data-d"))));syncDraft()},
 dp:function(el){S.draft.people=Math.min(4,Math.max(1,S.draft.people+(+el.getAttribute("data-d"))));syncDraft()},
 publish:function(){
  var d=S.draft;if(d.title.trim().length<3||!(d.amount>0))return;
  var e=est(d);
  var n={id:"n"+(++uid),cat:d.cat,title:d.title.trim(),desc:d.desc.trim(),q:d.q,hours:d.hours,people:d.people,pay:e.per,total:e.total,fee:e.fee,startAt:startTs(d.start),status:"search",apps:[],createdAt:Date.now(),rated:0};
  S.posted.unshift(n);S.draft=newDraft();S.tab="needs";render();window.scrollTo(0,0);
  toast("Besoin publié, "+fmtE(e.total)+" bloqués (simulation)");
  for(var i=0;i<n.people+2;i++){(function(k){later(function(){addApplicant(n.id)},3000+k*4500+Math.random()*1500)})(i)}
 },
 openNeed:function(el){sheetNeed(el.getAttribute("data-id"))},
 acceptApp:function(el){
  var n=findN(el.getAttribute("data-n"));if(!n)return;
  var a=n.apps.filter(function(x){return x.id===el.getAttribute("data-a")})[0];if(!a)return;
  a.ok=true;
  var ok=n.apps.filter(function(x){return x.ok}).length;
  if(ok>=n.people){
   n.apps=n.apps.filter(function(x){return x.ok});n.status="accepted";
   toast(n.people>1?"Équipe confirmée":a.name+" est confirmé(e)");progressNeed(n);
  }
  renderNav();sheetNeed(n.id);if(S.tab==="needs")render();
 },
 cancelNeed:function(el){
  var id=el.getAttribute("data-id");var n=findN(id);if(!n||n.status!=="search")return;
  S.posted=S.posted.filter(function(x){return x.id!==id});closeSheet();render();toast("Besoin annulé, fonds débloqués");
 },
 payNeed:function(el){
  var n=findN(el.getAttribute("data-id"));if(!n||n.status!=="review")return;
  n.status="paid";S.spent.unshift({t:Date.now(),label:n.title,amt:n.total,id:n.id});
  renderNav();render();sheetNeed(n.id);toast("Paiement envoyé : "+fmtE(n.total));
 }
};

 if(e.key==="Escape"&&!$("#ov").hidden){closeSheet();return}
 if(e.key==="Enter"&&e.target&&e.target.id==="msg"){e.preventDefault();A.send();return}
 if((e.key==="Enter"||e.key===" ")&&e.target&&e.target.getAttribute&&e.target.getAttribute("role")==="button"){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
});
$("#ov").addEventListener("click",function(e){if(e.target===this)closeSheet()});
document.addEventListener("input",function(e){
 var t=e.target;
 switch(t.id){
  case "q":S.q=t.value;renderList();break;
  case "dTitle":S.draft.title=t.value;syncDraft();break;
  case "dDesc":S.draft.desc=t.value;break;
  case "dAmt":S.draft.amount=parseFloat(t.value)||0;syncDraft();break;
  case "rad":S.p.radius=+t.value;var rv=$("#radv");if(rv)rv.textContent=t.value+" km";save();break;
  case "pname":S.p.name=t.value;save();break;
 }
});
document.addEventListener("change",function(e){
 var t=e.target;
 switch(t.id){
  case "sort":S.sort=t.value;renderList();break;
  case "swNow":S.nowOnly=t.checked;renderList();break;
  case "swBorder":S.border=t.checked;renderList();break;
  case "swAvail":S.p.avail=t.checked;save();toast(t.checked?"Tu es disponible":"Tu es en pause");break;
  case "dQ":S.draft.q=t.value;break;
 }
});

/* ---------- live: new missions, labels, timers ---------- */
setInterval(function(){
 var a=S.active,el=$("#wtimer");
 if(a&&el){if(a.step===1)el.textContent=mmss(a.arriveAt-Date.now());else if(a.step===2)el.textContent=mmss(Date.now()-a.workStart)}
},1000);
setInterval(function(){
 var cut=Date.now()-20*60000;
 S.missions=S.missions.filter(function(m){return m.startAt>cut});
 if(S.mode==="worker"&&S.tab==="missions"&&$("#ov").hidden)renderList();
},30000);
function liveMission(){
 if(extraI>=EXTRA.length)return;
 var m=build(EXTRA[extraI++]);S.missions.push(m);
 if(S.p.avail&&dist(m)<=S.p.radius)notify("Nouvelle mission près de toi : "+m.title+" ("+eur(m.pay)+")");
 if(S.mode==="worker"&&S.tab==="missions"&&$("#ov").hidden)renderList();
}
setTimeout(liveMission,22000);
setInterval(liveMission,50000);

/* ---------- boot ---------- */
load();
if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);
POOL.forEach(function(t){S.missions.push(build(t))});
render();
if(!S.onboarded)sheetWelcome();
})();
</script>
</body>
</html>
